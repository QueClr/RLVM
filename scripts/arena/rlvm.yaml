# DRAFT arena checker definition for RLVM (lean-kernel-arena: checkers/rlvm.yaml). NOT SUBMITTED.
#
# `url` is the public repository (the code is dual-licensed Apache-2.0 OR MIT). `ref` and `rev` below are
# still PLACEHOLDERS, on purpose: they are filled in AT SUBMISSION with the branch and the full hash of
# a pushed commit that contains pom.xml, env.sh, scripts/ and every module of the parent pom (the arena
# fetches exactly that commit with depth 1), and this file is re-read against the binary once more then.
#
# WHAT IS SHIPPED (2026-11-25; *agentic-note*: design-packaging, *agentic-note*: design-gate):
#
# - THE MACHINE IS THE DEFAULT ENGINE since 2026-11-25T03:05Z (rlvm-machine: the worklist machine, the
#   engine the project is named after; its provider's priority is 100 and nothing in this file selects
#   the engine, the binary follows the priority). A run without options checks with the machine and the
#   switch set that `rlvm --version` prints (the set of wave 6 plus eager reduction and the two
#   proof-comparison shortcuts, skipargs and congruence). The reference engine (rlvm-ref: the official
#   kernel's algorithm on hash-consed terms) re-checks every rejection before it is reported and decides
#   every declaration the machine declines; `-X engine=reference` or `-X policy=strict` checks with it
#   alone.
# - GATED on the machine-default launcher, no -X anywhere (scripts/gate.sh --defaults --corpus all
#   --hostile; the oracle of every step is an official verdict): 230 of 230 published arena tests
#   correct, none declined; 17,775 mutants of them: no accepted bad mutant, no rejected good one (agree
#   15,741, declined 2,034); 1,196 hostile exports: no wrong accept, no wrong reject (agree 1,124, 68
#   accepts of the tolerated kind, 4 declined); all eight corpora accepted.
# - THE ARENA'S COMPLETE TEST SET (270 tests: 148 good incl. the eight corpora, 92 bad, 30 `either`) by
#   the arena's own procedure, on the machine-default binary of the frozen jar set (2026-11-25, the
#   development image and the release-layout image, same status on all 270; *agentic-note*: rep-AR2):
#   no wrong verdict, no error, no timeout - 148 of 148 good accepted, 92 of 92 bad rejected, of the
#   `either` tests 11 accepted, 17 rejected and TWO DECLINED - `corner-cases/eta-struct-major-no-whnf`
#   and `eta-struct-major-and-no-whnf`: the official kernel does not terminate there, RLVM says so and
#   exits with 2. Two `either` tests are accepted that the official checker (v4.35.0) and RLVM's
#   reference engine reject: `corner-cases/alg-conv-trans-quot-left` and `eta-struct-major-and` (the
#   two proof-comparison shortcuts; with the reference engine the split is 9 / 19 / 2). The largest
#   share of a time limit is 5 %. Not measured on x86-64.
# - THE POLICY of the default configuration is "practical" (the maintainer's decision; *agentic-note*:
#   design-exactness-contract): (a) never accept a statement that is not derivable in Lean's type
#   theory; (b) the official verdict on every real input - what lean4export writes, the arena's good and
#   bad tests, the mutant corpora; (c) everything the official checker accepts is accepted; (d) a
#   derivable statement that the official checker rejects only through its own incompleteness,
#   non-transitivity, cache order or object identity may be accepted (the known classes: *agentic-note*:
#   design-official-divergence; on the arena's test set only the two `either` tests named above). A rejection of a file in which the
#   loader dropped a metadata node is checked again in the strict mode before it is reported. The strict
#   mode is one option, `-X policy=strict`: the reference engine alone, declining where it would need
#   the official object identity. The run line below is the default policy.
# - The Truffle tier (rlvm-truffle) is compiled into the binary and OFF (switch t2 of the machine).
#
# ONE EXECUTABLE (owner note 16; *agentic-note*: design-packaging): the build makes exactly one file,
# `work/dist/bin/rlvm`, a GraalVM CE native image (-O3, serial collector) that needs no JDK and no jars,
# and the run line executes it. It is the same executable a release archive holds, and a run without
# options is its fastest configuration (`rlvm --version` says which engine, worker rule, load rule and
# heap settings that is). The arena starts one fresh process per export, which is what an executable is
# for: it starts in 0.02 s and is at its steady speed from the first second (a cold run of the image is
# within 6 % of a warm pass on Mathlib). The JVM launcher that this repository also knows
# (`scripts/build.sh --dev`: the jars on HotSpot, 0.6 to 0.85 times the image's wall clock once warm,
# 1.3 to 4 times slower on the first run of every corpus below Mathlib; *agentic-note*: rep-benchmarks)
# is a development tool for the warm benchmarks and the gates; it is not built by the arena's build
# line and not part of a release.
# The build uses GraalVM CE only; Oracle GraalVM is never downloaded or used by a default build
# (the maintainer's standing policies, *agentic-note*: standing-policies: a profile-guided build with
# Oracle GraalVM exists as an explicit option of scripts/build.sh and is not what this definition builds).
#
# WHAT THE BUILD LINE BUILDS: scripts/arena/build.sh = scripts/build.sh from the tree, online Maven with
# the third-party jars pinned by sha256 (scripts/arena/deps.sha256). The image's class path is the 22
# jars of every distribution that is gated and measured here (`scripts/build.sh --published`): the test
# kit (rlvm-testkit), which a tree build used to add as a 23rd jar, is not compiled and not shipped. The
# image is built with the machine's inline lists (force-inline of its continuation steps, never-inline
# of its slow paths: "H10", -0.7 to -4.4 % CPU time for the machine); they are generated at build time
# with the `javap` and `jar` of the GraalVM the build downloads - nothing the arena's shell must have -
# and the build falls back to an image without them if that fails.
#
# WORKERS AND LOAD (*agentic-note*: dec-EGMG): `--threads 8`, one worker per CPU of the 8-vCPU runner
# (what `--threads auto` chooses there), decided by wall clock: with the machine 7 workers are level
# with 8 and 6 are 5 % slower. Without any option a run with two or more workers on a file of 8 MiB or
# more loads PIPELINED (the workers check while the file is read; one scanner thread from 256 MiB); a
# batch load is 21 % slower. The arena's small tests are below 8 MiB and are loaded in one piece; the
# driver gives a file one worker per 128 declarations, so most of them run on one. The image runs with
# a heap of at most 13 GB and the collection policy BySpaceAndTime of the serial collector (`rlvm
# --version` prints the settings). To change the count, change BOTH numbers below (`--threads` in the
# run line and `threads:`, the CPU slots the arena's parallel runner reserves).
#
# bench/rlvm/run.sh, suite.sh and measure.sh read the `run:` line of this file, so that local
# measurements execute exactly the command the arena would. Keep it on one line.
description: |
  **RLVM** (Rabdos Lean VM) is a Lean 4 kernel written in Java and shipped as a GraalVM native
  image (no JVM start-up, no warm-up).

  This version checks every declaration with its *machine*: a worklist machine whose instructions
  are the judgments of the kernel algorithm (type inference, weak-head normalisation, definitional
  equality with lazy delta reduction, the Nat and String literal extensions), with the
  environment's constants elaborated into code for it, over hash-consed terms that are integer ids
  into flat primitive arrays, which the garbage collector does not trace. A second engine is in
  the same binary: the *reference engine*, a direct port of the official kernel's algorithm. It
  re-checks every rejection of the machine before it is reported and decides every declaration
  the machine declines, so a rejection is never the machine's word alone. Universe levels are
  compared as the official kernel compares them. The policy is *practical* (see below);
  `-X policy=strict` checks with the reference engine alone.

  Policy: *practical*. RLVM gives the official verdict on everything a Lean exporter writes and
  on the arena's good and bad tests, and never accepts a statement that is not derivable in Lean's
  type theory. It does not reproduce the official implementation's object identity and cache order:
  a hand-made export that the official checker rejects only for such a reason (a term against the
  same term inside a metadata node, two `let` terms that differ in the non-dependence flag, one
  subterm written as two export records) may be accepted - what it states is derivable. With
  `-X policy=strict` RLVM declines such input instead of accepting it.

  Nothing derived in the export is trusted: recursors, constructor data and flags of inductive
  types are regenerated and compared with the exported records, the quotient declarations are
  checked against their expected form, and theorem values are checked like definitions.

  Declarations are checked by parallel workers while the file is still being read; a declaration
  sees only the declarations before it in the file, and the verdict is the first failure in file
  order whatever the number of workers and however the reading and the checking interleave. A
  rejection found by a worker is reported only after a second, cold run of the kernel has
  confirmed it.

  The process fails closed: the exit status starts as "internal error" and becomes 0 only after
  the whole export has been processed successfully; an exception, an out-of-memory error or a
  stack overflow, on any thread, is a non-zero status and can never read as acceptance. Input
  that RLVM cannot represent exactly (for example metadata inside an inductive declaration) is
  declined, never guessed.

  The build step downloads a pinned GraalVM Community Edition and Maven for the runner's
  architecture, verifies their checksums and those of the third-party jars that go into the
  image, and builds from source.
language: java
# `ref` and `rev` are PLACEHOLDERS until submission: see the first comment of this file.
url: https://github.com/QueClr/RLVM
ref: main
rev: "0000000"
version: "0.1.0-SNAPSHOT"
# Fetches GraalVM CE 25.5.5.0.3 (linux-x64 or linux-aarch64, sha256-pinned) and Maven 3.9.16
# (sha512-pinned) into .toolchain/, builds the modules that ship and the native image
# work/dist/bin/rlvm, and verifies the image (exit-status protocol, Truffle runtime compilation)
# before it finishes.
build: scripts/arena/build.sh
# The run line maps the binary's status back: RLVM_STATUS_BASE=10 makes rlvm exit with 10 / 11 / 12
# for accept / reject / decline, and everything else becomes 3. A runtime that fails before the
# checker starts (it would exit with 1, e.g. on a bad VM option or a heap it cannot reserve), a
# crash or a kill is thereby reported as an error and never as a rejection.
run: RLVM_STATUS_BASE=10 work/dist/bin/rlvm --threads 8 "$IN"; case $? in 10) exit 0;; 11) exit 1;; 12) exit 2;; *) exit 3;; esac
threads: 8
