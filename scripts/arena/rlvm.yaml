#
# bench/rlvm/run.sh, suite.sh and measure.sh read the `run:` line of this file, so that local
# measurements execute exactly the command the arena would. Keep it on one line.
description: |
  **RLVM** (Rabdos Lean VM) is a Lean 4 kernel written in Java and shipped as a GraalVM native
  image (no JVM start-up, no warm-up).

  Declarations are checked by its *machine*: a worklist machine whose instructions are the
  judgments of the kernel algorithm - evaluation (normalisation by evaluation over hash-consed
  values that are integer ids into flat primitive arrays, which the garbage collector does not
  trace), weak-head normalisation, definitional equality with lazy delta reduction, type
  inference with expected types, and the Nat and String literal extensions. Constants are
  elaborated on demand into code blocks and case trees that the machine runs instead of walking
  terms. Sessions stay warm across declarations up to a 1 MiB cap, and universe levels are
  compared as the official kernel compares them.

  A second engine, the *reference engine* - a direct port of the official kernel's algorithm
  with the official caches - confirms every rejection in a cold run before it is reported, and
  decides every declaration the machine declines. The machine declines by design every
  declaration that compares under `eagerReduce` (0.2 to 0.9 % of the declarations of the large
  corpora), because conversion under eager reduction depends on the official kernel's
  per-declaration caches; those declarations are checked by the reference engine alone.

  Nothing derived in the export is trusted: recursors, constructor data and flags of inductive
  types are regenerated and compared with the exported records, the quotient declarations are
  checked against their expected form, and theorem values are checked like definitions.

  Declarations are checked by parallel workers over a frozen shared store; a declaration sees only
  the declarations before it in the file, and the verdict is the first failure in file order
  whatever the number of workers.

  The process fails closed: the exit status starts as "internal error" and becomes 0 only after
  the whole export has been processed successfully; an exception, an out-of-memory error or a
  stack overflow, on any thread, is a non-zero status and can never read as acceptance. Input
  that RLVM cannot represent exactly (for example metadata inside an inductive declaration) is
  declined, never guessed.

  Measured on the project's aarch64 host in a container shaped like the arena runner (CPU time /
  wall clock of a fresh process with this run line): ARENA_NUMBERS_LINE

  The build step downloads a pinned GraalVM Community Edition and Maven for the runner's
  architecture, verifies their checksums and those of the third-party jars that go into the
  image, and builds from source.
language: java
url: https://example.invalid/rlvm.git
ref: main
rev: "0000000"
version: "0.1.0-SNAPSHOT"
# Fetches GraalVM CE 25.5.5.0.3 (linux-x64 or linux-aarch64, sha256-pinned) and Maven 3.9.16
# (sha512-pinned) into .toolchain/, builds all modules and the native image work/dist/bin/rlvm,
# and verifies the image (exit-status protocol, Truffle runtime compilation) before it finishes.
build: scripts/arena/build.sh
# The run line maps the binary's status back: RLVM_STATUS_BASE=10 makes rlvm exit with 10 / 11 / 12
# for accept / reject / decline, and everything else becomes 3. A runtime that fails before the
# checker starts (it would exit with 1, e.g. on a bad VM option or a heap it cannot reserve), a
# crash or a kill is thereby reported as an error and never as a rejection.
run: RLVM_STATUS_BASE=10 work/dist/bin/rlvm --threads 4 "$IN"; case $? in 10) exit 0;; 11) exit 1;; 12) exit 2;; *) exit 3;; esac
threads: 4
