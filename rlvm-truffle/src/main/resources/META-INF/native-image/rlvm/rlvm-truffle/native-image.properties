# Picked up by native-image when rlvm-truffle.jar is on the class path.
# The Truffle language registration and the node classes must be initialised at image build time.
# T2Runtime names OptimizedCallTarget and the runtime's compilation listener (explicit compilation,
# docs/research/10 section 5.4); in an image the Truffle jars are modules, and these two packages are
# exported to named modules only.
Args = --initialize-at-build-time=rlvm.truffle \
       --add-exports=org.graalvm.truffle.runtime/com.oracle.truffle.runtime=ALL-UNNAMED \
       --add-exports=org.graalvm.truffle.compiler/com.oracle.truffle.compiler=ALL-UNNAMED
