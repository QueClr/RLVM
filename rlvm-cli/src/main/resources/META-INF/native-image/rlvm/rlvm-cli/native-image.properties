# Picked up by native-image whenever rlvm-cli.jar is on the class path.
#
# rlvm.cli (launcher and the Truffle probe language in rlvm.cli.probe) is initialised at image build
# time: Truffle requires it for language, node and root-node classes, and it turns BuildInfo's version
# strings into image constants. Classes of this package must therefore keep no static state that
# depends on the machine or the moment the image was built.
#
# Other modules ship their own file (META-INF/native-image/rlvm/<artifact>/native-image.properties)
# for their packages; scripts/build.sh adds only image-wide options.
Args = --initialize-at-build-time=rlvm.cli
