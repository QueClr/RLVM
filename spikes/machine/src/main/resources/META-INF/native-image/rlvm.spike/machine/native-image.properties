# Picked up automatically by native-image when machine.jar is on the class path.
# Everything is initialised at image build time: the Truffle language registration and node classes must be,
# and Mem.MODE (the arena access mode, -Drlvm.mem=N at BUILD time) has to be a compile-time constant.
# Mem$SegHolder owns off-heap MemorySegments and must stay run-time initialised.
Args = --initialize-at-build-time=rlvm.spike.machine \
       --initialize-at-run-time=rlvm.spike.machine.Mem$SegHolder
