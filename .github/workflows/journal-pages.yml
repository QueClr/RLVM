# Renders the journal (journal/, a Forester forest) and publishes it as GitHub
# Pages. The site's address is the `url` of journal/forest.toml.
name: journal

on:
  push:
    branches: [dev]
    paths:
      - 'journal/**'
      - '.github/workflows/journal-pages.yml'
  pull_request:
    paths:
      - 'journal/**'
      - '.github/workflows/journal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The derivation fails when Forester reports any diagnostic.
      - name: Build the forest
        working-directory: journal
        run: nix build .#site -L
      # Links in the rendered forest are absolute and start with the path
      # component of `url` in journal/forest.toml, so that directory is the
      # site root.
      - name: Collect the site root
        run: |
          mkdir -p _site
          cp -rL journal/result/RLVM/. _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        with:
          path: _site

  # A pull request, and a manual run on another branch, build and do not
  # publish.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
